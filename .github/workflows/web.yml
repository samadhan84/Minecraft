name: Web build (iPhone / iPad / browser)

# Builds the browser version (the same game compiled to JavaScript with TeaVM) and publishes it to the
# gh-pages branch, which GitHub Pages serves at https://<owner>.github.io/<repo>/
# (turn it on once: Settings -> Pages -> Deploy from a branch -> gh-pages / root).
on:
  push:
  workflow_dispatch:

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the game to JavaScript
        run: ./gradlew --no-daemon -PwebOnly :web:generateJavaScript
      - name: Put the site together
        run: |
          mkdir -p site
          cp web/src/main/webapp/* site/
          cp web/build/generated/teavm/js/game.js site/
          echo "window.DV_VERSION = \"web.${GITHUB_RUN_NUMBER}\";" > site/version.js
          touch site/.nojekyll
          ls -la site
      - name: Publish to GitHub Pages (gh-pages branch)
        if: github.event_name != 'pull_request'
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web version ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - uses: actions/upload-artifact@v4
        with:
          name: DhruvVishu-web
          path: site
