name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs (uses the Android SDK preinstalled on the runner)
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: DhruvVishu-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      # A fixed download link for TVs and phones (no login, no zip):
      # https://github.com/samadhan84/Minecraft/releases/download/latest/DhruvVishu.apk
      - name: Publish the APK to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/minecraft-android-clone-2fqpdz'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk DhruvVishu.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "DhruvVishu (latest build)" --notes "Newest DhruvVishu APK, updated on every build. On Android TV: install the Downloader app and open this APK's link."
          gh release upload latest DhruvVishu.apk --clobber
