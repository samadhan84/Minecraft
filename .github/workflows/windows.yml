name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the desktop game
        shell: cmd
        run: gradlew.bat --no-daemon -PdesktopOnly :desktop:installDist

      - name: Prepare files for the installer
        shell: pwsh
        run: |
          # Only the Windows native libraries are needed on Windows.
          New-Item -ItemType Directory -Force build/pkg/input | Out-Null
          Get-ChildItem desktop/build/install/DhruvilCraft/lib/*.jar |
            Where-Object { $_.Name -notmatch 'natives-(linux|macos)' } |
            Copy-Item -Destination build/pkg/input
          java -cp "build/pkg/input/*" com.vishucraft.desktop.MainKt --make-icon build/pkg

      - name: Make sure WiX (needed by jpackage for .exe installers) is available
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) { exit 0 }
          if ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) { "$env:WIX\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH; exit 0 }
          choco install wixtoolset -y --no-progress
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build installer (DhruvilCraft-Setup.exe) and portable zip
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $common = @(
            '--name', 'DhruvilCraft',
            '--app-version', $version,
            '--vendor', 'DhruvilCraft',
            '--description', 'DhruvilCraft - a block building and survival game',
            '--input', 'build/pkg/input',
            '--main-jar', 'desktop.jar',
            '--main-class', 'com.vishucraft.desktop.MainKt',
            '--icon', 'build/pkg/icon.ico',
            '--dest', 'dist'
          )
          jpackage --type exe @common --win-menu --win-shortcut --win-dir-chooser --win-per-user-install `
            --win-menu-group DhruvilCraft --win-upgrade-uuid 7b1d3c52-6a0e-4f4e-9d0c-5b9a2f6c1e21
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item "dist/DhruvilCraft-$version.exe" "DhruvilCraft-Setup.exe"
          jpackage --type app-image @common --dest dist/portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/portable/DhruvilCraft -DestinationPath dist/DhruvilCraft-portable.zip
          Get-ChildItem dist

      - name: Check that the game starts
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          JAVA_TOOL_OPTIONS: -XX:-CreateCoredumpOnCrash -XX:ErrorFile=crash/hs_err_%p.log
        run: |
          # Software OpenGL (Mesa llvmpipe) so the game can run on the runner, which has no graphics card.
          New-Item -ItemType Directory -Force crash, smoke | Out-Null
          Copy-Item -Recurse dist/portable/DhruvilCraft smoke/
          $mesa = "https://github.com/pal1000/mesa-dist-win/releases/download/24.2.8/mesa3d-24.2.8-release-msvc.7z"
          try {
            Invoke-WebRequest $mesa -OutFile mesa.7z
            7z x mesa.7z -omesa | Out-Null
            Get-ChildItem mesa/x64 | Select-Object Name
            Copy-Item mesa/x64/*.dll smoke/DhruvilCraft/
          } catch { Write-Host "Could not download Mesa: $_" }
          $p = Start-Process smoke/DhruvilCraft/DhruvilCraft.exe -ArgumentList '--demo', "$PWD/screenshots" -PassThru -NoNewWindow `
            -RedirectStandardOutput crash/stdout.txt -RedirectStandardError crash/stderr.txt
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host "Timed out" }
          Get-Content crash/stdout.txt, crash/stderr.txt -ErrorAction SilentlyContinue
          Get-ChildItem screenshots -ErrorAction SilentlyContinue
          Copy-Item screenshots/home/crash.txt crash/ -ErrorAction SilentlyContinue
          Get-ChildItem crash/hs_err_*.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_ -TotalCount 60 }
          if (-not (Test-Path screenshots/03-creative-world.png)) { Write-Host "::warning::The game did not reach the world in the smoke test" }

      - uses: actions/upload-artifact@v4
        with:
          name: DhruvilCraft-windows
          path: |
            dist/DhruvilCraft-Setup.exe
            dist/DhruvilCraft-portable.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-test
          path: |
            screenshots/*.png
            crash/*
          if-no-files-found: ignore
