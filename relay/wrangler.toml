# The DhruvVishu online relay: passes game data between a host and the friends who joined with its room code.
# Deployed by .github/workflows/android.yml with the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
name = "dhruvvishu-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
