<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" id="viewport" content="width=device-width, initial-scale=1">
  <script>
    // On a TV, lay the page out at 1920×1080 and let the WebView scale it to the screen.
    if (window.Android && Android.isTv()) document.getElementById('viewport').content = 'width=1920';
  </script>
  <title>Arduino AI</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1><span class="logo">∞</span> Arduino AI</h1>
    <label class="board">Board <select id="board" class="nav"></select></label>
    <span class="grow"></span>
    <button id="btnExamples" class="nav">Examples</button>
    <button id="btnSketches" class="nav">My sketches</button>
    <button id="btnSettings" class="nav">Settings</button>
  </header>

  <main>
    <section id="left">
      <h2>Ask Claude</h2>
      <div class="askRow">
        <input id="message" class="nav" type="text" placeholder="What should your Arduino do?">
        <button id="btnVoice" class="nav icon" title="Speak">🎤</button>
      </div>
      <p class="hint" id="hint">Example: “blink an LED on pin 13 every half second” or “read a DHT11 and show it on Serial”.</p>
      <div class="actions">
        <button id="btnWrite" class="nav primary" data-task="write">✨ Write new code</button>
        <button id="btnChange" class="nav" data-task="change">✏️ Change my code</button>
        <button id="btnFix" class="nav" data-task="fix">🛠️ Fix error</button>
        <button id="btnExplain" class="nav" data-task="explain">💡 Explain code</button>
      </div>
      <h2>Answer</h2>
      <div id="answer" class="nav scroll" tabindex="0"><p class="muted">Claude's explanation, wiring and tips show up here.</p></div>
    </section>

    <section id="right">
      <div class="codeHead">
        <h2 id="sketchName">New sketch</h2>
        <span class="grow"></span>
        <button id="btnEdit" class="nav">Edit</button>
        <button id="btnUndo" class="nav" disabled>Undo</button>
        <button id="btnSave" class="nav">Save</button>
        <button id="btnNew" class="nav">New</button>
        <button id="btnQr" class="nav primary">Copy to phone (QR)</button>
      </div>
      <pre id="code" class="nav scroll" tabindex="0"></pre>
    </section>
  </main>

  <div id="busy" class="overlay hidden">
    <div class="box center">
      <div class="spinner"></div>
      <p id="busyText">Claude is writing your code…</p>
      <button id="btnCancel" class="nav">Cancel</button>
    </div>
  </div>

  <div id="modal" class="overlay hidden">
    <div class="box">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="modalButtons" class="buttons"></div>
    </div>
  </div>

  <script src="boards.js"></script>
  <script src="app.js"></script>
</body>
</html>
